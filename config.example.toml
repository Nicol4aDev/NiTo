# Configurazione del bot — copia questo file in config.toml e compila [telegram].
# config.toml contiene il token: non condividerlo e non pubblicarlo.

[telegram]
token = ""                     # token del bot, da @BotFather (es. "123456789:AAH...")
allowed_users = []             # il tuo user id, da @userinfobot (es. [123456789]; più id: [111, 222])

[general]
database = "roulette.sqlite3"
history = 500                  # giri tenuti in memoria per tavolo (serie e ritardi)
notify_continuation = true     # dopo l'alert, avvisa a ogni giro in più della serie
notify_break = true            # avvisa quando una serie segnalata si interrompe
max_alerts_per_chat = 30

# Ogni [[tables]] è un tavolo. Campi comuni:
#   id        identificativo breve (a-z, 0-9, - e _), si usa nei comandi: /ultimi evo-speed
#   name      nome mostrato
#   provider  provider del gioco: gli alert si possono limitare a un provider
#   wheel     "european" (0-36, default) o "american" (0, 00, 1-36)
#   source    da dove arrivano i risultati:
#               manual     inseriti da Telegram con /add o /inserisci
#               simulator  giri casuali ogni interval_sec (per provare il bot)
#               http_json  letti da un feed JSON ogni interval_sec (vedi esempio in fondo)

