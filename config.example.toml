# Esempio di feed JSON. I provider non pubblicano API aperte con i risultati:
# usa un servizio a cui hai accesso e che sei autorizzato a interrogare.
# Se il feed risponde, per esempio:
#   {"data": {"results": [{"gameId": "a91f", "result": {"number": 17}}, ...]}}
# con il giro più recente per primo, la configurazione è:
#
# [[tables]]
# id = "evo-xxxtreme"
# name = "XXXtreme Lightning Roulette"
# provider = "Evolution"
# source = "http_json"
# url = "https://esempio.it/api/xxxtreme/ultimi"
# interval_sec = 15
# items_path = "data.results"   # dove sta la lista dei giri ("" = la risposta stessa)
# number_path = "result.number" # dove sta il numero dentro ogni giro
# id_path = "gameId"            # id univoco del giro: evita di contarlo due volte
# newest_first = true           # false se la lista va dal più vecchio al più recente
# timeout_sec = 10
# [tables.headers]               # opzionale; ${VAR} = variabile d'ambiente
# Authorization = "Bearer ${FEED_TOKEN}"
