# Configurazione del roulette tracker — copia in roulette.toml e modifica.
# Il token del bot e gli utenti autorizzati vanno SOLO nel file .env
# (ROULETTE_BOT_TOKEN, ROULETTE_ALLOWED_USERS).

[general]
database = "roulette.sqlite3"
history = 500                  # giri tenuti in memoria per tavolo (serie e ritardi)
notify_continuation = true     # dopo l'alert, avvisa a ogni giro in più della serie
notify_break = true            # avvisa quando una serie segnalata si interrompe
max_alerts_per_chat = 30

# Ogni [[tables]] è un tavolo. Campi comuni:
#   id        identificativo breve (a-z, 0-9, - e _), si usa nei comandi: /ultimi evo-lightning
#   name      nome mostrato
#   provider  provider del gioco: gli alert si possono limitare a un provider
#   wheel     "european" (0-36, default) o "american" (0, 00, 1-36)
#   source    da dove arrivano i risultati:
#               manual     inseriti da Telegram con /add o /inserisci
#               simulator  giri casuali ogni interval_sec (per provare il bot)
#               http_json  letti da un feed JSON ogni interval_sec (vedi esempio in fondo)

[[tables]]
id = "evo-lightning"
name = "Lightning Roulette"
provider = "Evolution"
source = "manual"

[[tables]]
id = "evo-immersive"
name = "Immersive Roulette"
provider = "Evolution"
source = "manual"

[[tables]]
id = "pp-mega"
name = "Mega Roulette"
provider = "Pragmatic Play"
source = "manual"

[[tables]]
id = "pt-quantum"
name = "Quantum Roulette"
provider = "Playtech"
source = "manual"

[[tables]]
id = "ezugi-auto"
name = "Auto Roulette"
provider = "Ezugi"
source = "manual"

[[tables]]
id = "us-demo"
name = "American Roulette"
provider = "Demo"
wheel = "american"
source = "manual"

# Tavolo simulato: genera un numero casuale ogni 20 secondi. Utile per
# provare gli alert subito; toglilo quando colleghi le tue fonti.
[[tables]]
id = "demo"
name = "Roulette simulata"
provider = "Demo"
source = "simulator"
interval_sec = 20

# Esempio di feed JSON. I provider non pubblicano API aperte con i risultati:
# usa un servizio a cui hai accesso e che sei autorizzato a interrogare.
# Se il feed risponde, per esempio:
#   {"data": {"results": [{"gameId": "a91f", "result": {"number": 17}}, ...]}}
# con il giro più recente per primo, la configurazione è:
#
# [[tables]]
# id = "evo-xxxtreme"
# name = "XXXtreme Lightning Roulette"
# provider = "Evolution"
# source = "http_json"
# url = "https://esempio.it/api/xxxtreme/ultimi"
# interval_sec = 15
# items_path = "data.results"   # dove sta la lista dei giri ("" = la risposta stessa)
# number_path = "result.number" # dove sta il numero dentro ogni giro
# id_path = "gameId"            # id univoco del giro: evita di contarlo due volte
# newest_first = true           # false se la lista va dal più vecchio al più recente
# timeout_sec = 10
# [tables.headers]               # opzionale; ${VAR} viene letto dal .env
# Authorization = "Bearer ${FEED_TOKEN}"
