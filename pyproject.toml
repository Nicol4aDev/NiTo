[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nito"
version = "0.1.0"
description = "Bot Telegram di segnali e trading automatico con TP/SL e gestione del rischio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0,<23",
    "ccxt>=4.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
nito = "nito.__main__:main"
nito-backtest = "nito.backtest:main"
nito-roulette = "nito.roulette.__main__:main"

[tool.setuptools.packages.find]
include = ["nito*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
